server.port=8080
server.servlet.context-path=/api

spring.application.name=search-aggregator
spring.jackson.mapper.sort-properties-alphabetically=false

springdoc.swagger-ui.tryItOutEnabled=true


# Reciprocal Rank Fusion (RRF) smoothing constant.
# Low values (10-20) aggressively favor top-ranked results from each node.
# High values (60+) favor consensus and dampen the advantage of the #1 rank.
# Since the default fetch quantity is 10 results per node, a value of 20 is recommended.
scoring.rrf.k=20


# set to true to use specific endpoints registered on node-endpoints.json
node.endpoints.manual-config=false
node.registry.url=https://node-devel.eosc.grnet.gr/federation-backend/tenants/eosc-beyond/nodes
node.registry.key=
node.cache.ttl-minutes=10
node.cache.refresh-rate-minutes=5

# Per-node HTTP timeouts for the RestClient used to fan out to each node (search, id lookup,
# similarity check). Bounds how long an unresponsive node can stall an aggregated response.
node.request.connect-timeout-ms=2000
node.request.read-timeout-ms=5000

# GET /federation/{collection}/ids - the lightweight {id,name} inventory that populates a node's
# relational-field dropdowns from across the federation.
# cache-ttl-minutes: how long a resource-type's inventory is served from cache before the
#   fan-out to every node is repeated. Trades dropdown freshness against fan-out load.
# max-per-node: hard cap on records pulled from a single node, so one misbehaving node cannot
#   stream an unbounded response into the aggregator.
federation.resource-ids.cache-ttl-minutes=5
federation.resource-ids.max-per-node=10000

# GET /federation/{collection}/{prefix}/{suffix} - single-resource lookup by id. Cached
# (misses included, as negative results) so a node's repeated cross-node reference checks
# don't re-fan-out to every node each time.
federation.resource-by-id.cache-ttl-minutes=5